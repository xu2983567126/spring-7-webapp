<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Spring Framework Guru</title>
</head>
<body>
<h1>booklist</h1>

<table>
  <thead>
  <tr>
    <th>id</th>
    <th>title</th>
    <th>publisher</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="book : ${books}">
    <td th:text="${book.id}">123</td>
    <td th:text="${book.title}">Spring in Action</td>
    <td th:text="${book.publisher.publisherName}">Wrox</td>
  </tr>
  </tbody>
</table>
</body>
</html>
